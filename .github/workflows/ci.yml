name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: issuebot
          POSTGRES_DB: issuebot
          # A throwaway inside the runner, like compose's test-db: no credential to commit (#78).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U issuebot -d issuebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://issuebot@localhost:5432/issuebot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: compose config under each profile
        run: |
          docker network create issuebot
          for profiles in hub worker hub,worker; do
            # Both directions (#78): without the store's password nothing configures -- the
            # refusal is the invariant, so a default creeping back in fails the PR -- and with
            # one every profile does.
            for unset_or_empty in unset empty; do
              if [ "$unset_or_empty" = empty ]; then export ISSUEBOT_DB_PASSWORD=; else unset ISSUEBOT_DB_PASSWORD; fi
              if out=$(COMPOSE_PROFILES=$profiles docker compose config --quiet 2>&1); then
                echo "profile '$profiles' configured with ISSUEBOT_DB_PASSWORD $unset_or_empty" >&2
                exit 1
              fi
              case "$out" in *ISSUEBOT_DB_PASSWORD*) ;; *)
                echo "the refusal did not name ISSUEBOT_DB_PASSWORD: $out" >&2; exit 1;;
              esac
            done
            COMPOSE_PROFILES=$profiles ISSUEBOT_DB_PASSWORD=ci-only docker compose config --quiet
            # The dashboard's password is a pass-through, not a requirement (#73): a
            # worker-only checkout configures without it, and with it every profile does.
            COMPOSE_PROFILES=$profiles ISSUEBOT_DB_PASSWORD=ci-only ISSUEBOT_WEB_PASSWORD=ci-only docker compose config --quiet
          done
          # The dashboard runs as its own account (#102): the compose side of the choice, that
          # the service selects `web` rather than inheriting the image's `USER issuebot`. The
          # image side -- that the account exists and cannot invoke sudo -- is proved below.
          test "$(COMPOSE_PROFILES=hub ISSUEBOT_DB_PASSWORD=ci-only docker compose config --format json | jq -r .services.web.user)" = web
          test "$(COMPOSE_PROFILES=worker ISSUEBOT_DB_PASSWORD=ci-only docker compose config --format json | jq -r '.services.worker.user // "none"')" = none
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: issuebot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm issuebot:ci --version
      - name: the default build bakes in no optional toolchain
        run: |
          for tool in initdb node npm; do
            if docker run --rm --entrypoint sh issuebot:ci -c "command -v $tool"; then
              echo "the optional build args default to empty; the default image must not carry $tool" >&2
              exit 1
            fi
          done
      # The locale (#66) is the image's, not the PostgreSQL stanza's, so it is asserted on both
      # builds: the base image sets none, and every tool in the container reads one. `bash -lc`
      # as well as `sh -c` for the same reason the recipe below runs in a login shell --
      # /etc/profile is free to overwrite what the image set, and the hooks run that way.
      # LC_ALL has to stay *unset*, which is why it is asserted rather than left to omission: it
      # overrides every category, so setting it would stop a target repository's own LC_*
      # settings from taking effect.
      - name: the default build's locale is UTF-8
        run: |
          test "$(docker run --rm --entrypoint sh issuebot:ci -c 'echo $LANG')" = C.UTF-8
          test "$(docker run --rm --entrypoint bash issuebot:ci -lc 'echo $LANG')" = C.UTF-8
          test -z "$(docker run --rm --entrypoint sh issuebot:ci -c 'echo ${LC_ALL-}')"
      # The session and the worker are two accounts (#75), and the image is where that line is
      # drawn: the worker (issuebot, 1000) may become the session's account (agent, 1001) and
      # nobody else; the session's account cannot invoke sudo, write the worker's code or
      # claude, enter the worker's home, or read the worker's environment, although the pid
      # namespace is shared; and claude runs as both. Each is a `docker run`, since the
      # sandbox is exactly what a unit test cannot see.
      - name: the session's account is separate from the worker's and reaches nothing of it
        run: |
          test "$(docker run --rm --entrypoint id issuebot:ci -u)" = 1000
          test "$(docker run --rm --user agent --entrypoint id issuebot:ci -u)" = 1001
          test "$(docker run --rm --entrypoint sudo issuebot:ci -n -u agent id -u)" = 1001
          if docker run --rm --entrypoint sudo issuebot:ci -n -u root id -u; then
            echo "the worker may become root" >&2; exit 1
          fi
          if docker run --rm --user agent --entrypoint sudo issuebot:ci -n -u agent id -u; then
            echo "the session's account can invoke sudo" >&2; exit 1
          fi
          docker run --rm --user agent --entrypoint sh issuebot:ci -c '
            set -eu
            test ! -w /app
            test ! -w /app/.venv/bin/python
            test ! -w "$(readlink -f /usr/local/bin/claude)"
            test ! -r /home/issuebot
            test ! -x /home/issuebot
            test ! -r /etc/sudoers.d/issuebot
          '
          docker run --rm --entrypoint sh issuebot:ci -c 'set -eu; test ! -w /app; test ! -r /home/agent'
          docker run --rm --entrypoint bash issuebot:ci -c '
            sleep 5 &
            if sudo -n -u agent cat /proc/$!/environ >/dev/null 2>&1; then
              echo "the session read the worker environ" >&2; exit 1
            fi
          '
          docker run --rm --user agent --entrypoint claude issuebot:ci --version
      # The dashboard is a third account (#102): compose runs the `web` service as `web` (1002),
      # which takes HTTP from a browser and needs no privilege transition, so it gets none. The
      # sudo binary is executable by root and group issuebot alone, so as `web` the delegation
      # fails the way it fails as the session's account -- and `test -x` says why, that it is
      # not even executable rather than refused. Neither home, the sudoers drop-in nor the
      # worker's code is reachable from it. One `test` per line throughout: under `set -e` only
      # the last command of an AND list is enforced, so `test A && test B` asserts B alone.
      # The last line starts the app under it for real, as far as a database it has none of:
      # `[FAIL] database: cannot connect:` is the CLI's own line (`not configured` is the same
      # prefix printed before any attempt, which is why the grep names the connect), printed
      # after the interpreter, the package
      # and the web's dependencies have all loaded as uid 1002 and `cmd_web` has run to the
      # connection attempt, which is the one thing the account has to be able to do. Captured
      # and grepped rather than piped, since the job's shell has no pipefail.
      - name: the dashboard's account is a third one and cannot invoke sudo
        run: |
          test "$(docker run --rm --user web --entrypoint id issuebot:ci -u)" = 1002
          test "$(docker run --rm --user web --entrypoint id issuebot:ci -Gn)" = web
          if docker run --rm --user web --entrypoint sudo issuebot:ci -n -u agent id -u; then
            echo "the dashboard's account can invoke sudo" >&2; exit 1
          fi
          docker run --rm --user web --entrypoint sh issuebot:ci -c '
            set -eu
            test ! -x /usr/bin/sudo
            test ! -r /etc/sudoers.d/issuebot
            test ! -w /app
            test ! -w /app/.venv/bin/python
            test ! -r /home/issuebot
            test ! -x /home/issuebot
            test ! -r /home/agent
            test ! -x /home/agent
            test "$HOME" = /home/web
            test -w "$HOME"
          '
          docker run --rm --entrypoint sh issuebot:ci -c 'set -eu; test ! -r /home/web; test ! -x /home/web'
          docker run --rm --user agent --entrypoint sh issuebot:ci -c 'set -eu; test ! -r /home/web; test ! -x /home/web'
          if docker run --rm --user web -e ISSUEBOT_WEB_PASSWORD=ci-only \
               -e DATABASE_URL=postgresql://issuebot@127.0.0.1:1/issuebot \
               issuebot:ci web > /tmp/web-start.txt 2>&1; then
            echo "the dashboard started against a dead database" >&2; exit 1
          fi
          grep -q '^\[FAIL\] database: cannot connect: ' /tmp/web-start.txt
      # git's ownership check is part of the boundary rather than a detail of it: a workspace
      # directory is the worker's and the clone inside it is the session's, so without the
      # image's `safe.directory` entry every git command a session runs dies as `dubious
      # ownership` -- which is how it reached a live board instead of CI. The shape below is a
      # workspace exactly: the worker's sticky directory, the session's repository inside it.
      # `git init` stands in for the clone, since what git weighs is who owns what rather than
      # where the repository came from, and `git config --local` is the command that failed.
      # The scope is asserted too, so the entry can never be widened to a bare `*` quietly.
      - name: the session can run git in a workspace the worker owns
        run: |
          test "$(docker run --rm --entrypoint git issuebot:ci config --system --get-all safe.directory)" = '/workspaces/*'
          docker run --rm --entrypoint bash issuebot:ci -c '
            set -eu
            mkdir -m 1777 /workspaces/probe
            sudo -n -H -u agent git -C /workspaces/probe init -q
            test "$(stat -c %u /workspaces/probe)" = 1000
            test "$(stat -c %u /workspaces/probe/.git)" = 1001
            sudo -n -H -u agent bash -c "
              set -eu
              cd /workspaces/probe
              test \"\$(git rev-parse --show-toplevel)\" = /workspaces/probe
              git config --local --add issuebot.probe 1
            "
          '
      # `~/.claude.json` is the session account's own, in $HOME beside `.claude/` rather than
      # inside the `claude-home` volume, so it is recreated with each container and shared by
      # every session in one -- and `claude` loads `mcpServers` out of it, offering a planted
      # server's tools to whichever issue runs next. `--strict-mcp-config` is what stops that
      # (#119), and this runs the claude the image actually ships rather than reading a help
      # string, so a release that changed the flag's behaviour fails a PR here.
      # Two-sided on purpose: without the flag the planted server must be *listed*, or the
      # proof would pass just as well against a claude that never reads the file. No credential
      # is needed, because the init line is emitted before the login check -- the run ends at
      # `Not logged in`, which is also what shows the flag leaves a headless `claude -p`
      # working rather than dying on an unknown argument. `/bin/true` is server enough: one
      # that fails its handshake is still listed, and being listed is the loading at issue.
      # Every exit carries claude's own stderr: the likeliest failures here (a flag that no
      # longer parses, a claude that will not start, the timeout) produce *no* init line at
      # all, which under `set -e` would otherwise end the step with a bare exit code and throw
      # away the one thing that says why.
      - name: a planted MCP server in the session account's ~/.claude.json is not loaded
        run: |
          mkdir -p /tmp/mcp-probe
          cat > /tmp/mcp-probe/probe.sh <<'PROBE'
          set -eu
          init() {
            printf '%s' '{"mcpServers":{"planted":{"type":"stdio","command":"/bin/true"}}}' \
              > "$HOME/.claude.json"
            echo hi | timeout 300 claude -p --output-format stream-json --verbose \
              --permission-prompts none "$@" 2>/tmp/claude-stderr | grep -m1 '"subtype":"init"'
          }
          died() {
            echo "$1" >&2
            echo "--- claude stderr ---" >&2
            cat /tmp/claude-stderr >&2 || true
            exit 1
          }
          without=$(init) || died "no init line at all without the flag"
          case "$without" in
            *'"planted"'*) ;;
            *) died "claude did not load the planted server, so this proves nothing: $without" ;;
          esac
          with=$(init --strict-mcp-config) \
            || died "no init line with --strict-mcp-config: the flag did not parse, or claude died"
          case "$with" in
            *'"planted"'*) died "--strict-mcp-config still loaded ~/.claude.json: $with" ;;
          esac
          # Spacing-tolerant: this pins that the list came back empty, not how claude spells it.
          case "${with// /}" in
            *'"mcp_servers":[]'*) ;;
            *) died "the confined run reported no empty mcp_servers: $with" ;;
          esac
          echo "ok: loaded without the flag, gone with it"
          PROBE
          chmod a+rX /tmp/mcp-probe /tmp/mcp-probe/probe.sh
          docker run --rm --user agent -v /tmp/mcp-probe:/mcp-probe:ro \
            --entrypoint bash issuebot:ci -lc 'bash /mcp-probe/probe.sh'
      # The wrapper is what the worker actually runs (issuebot.agent.runas): the environment
      # crosses the uid change on a descriptor, so what the session sees is the mapping the
      # worker built with the account's own HOME, USER and LOGNAME, and nothing sudo adds or
      # strips -- the variable the container was started with included.
      - name: the wrapper hands the session exactly the environment the worker built
        run: |
          docker run --rm -i -e LEAKED_FROM_CONTAINER=1 --entrypoint python issuebot:ci - <<'PY'
          import os
          from issuebot.agent.runas import RunAs
          env = {"PATH": os.environ["PATH"], "HOME": os.environ["HOME"], "GH_TOKEN": "t", "CLAUDE_X": "1"}
          got = RunAs("agent").run(["env", "-0"], env, timeout=10)
          assert got.returncode == 0, got.stderr
          seen = dict(item.split("=", 1) for item in got.stdout.split("\0") if item)
          assert seen == {**env, "HOME": "/home/agent", "USER": "agent", "LOGNAME": "agent"}, seen
          assert RunAs("agent").probe(env) is None
          print("the session sees", sorted(seen))
          PY
      # The session account's ~/.claude is a shared volume across every session and repository
      # (#101), so a slash command, skill, rule, subagent, workflow, plugin or auto memory one
      # session plants there is loaded by the next at the same uid. The worker sweeps that config
      # before every turn; the credential and claude's own transcripts stay. Proved in the image
      # because it is the real uid split, the real sudo rule and the real home, and through the
      # worker's own code path (`RunAs.sweep_home`, the default target) rather than the helper
      # verb by hand, so a wrong default path or an argv the sudoers rule rejects fails here.
      - name: a session's ~/.claude config does not survive to the next session
        run: |
          docker run --rm --entrypoint bash issuebot:ci -c '
            set -eu
            # A prior session poisons the shared home and a credential is in place.
            sudo -n -H -u agent bash -c "
              set -eu
              mkdir -p /home/agent/.claude
              cd /home/agent/.claude
              mkdir -p commands skills/evil rules projects/-workspaces-issuebot-7/memory
              echo poison > commands/evil.md
              echo poison > skills/evil/SKILL.md
              echo poison > rules/evil.md
              echo poison > projects/-workspaces-issuebot-7/memory/MEMORY.md
              echo cred > .credentials.json
              echo transcript > projects/-workspaces-issuebot-7/keep.jsonl
            "
            # The worker (issuebot, uid 1000) sweeps the account home the way a turn start does.
            test "$(id -u)" = 1000
            /app/.venv/bin/python -c "from issuebot.agent.runas import RunAs; RunAs(\"agent\").sweep_home()"
            # The next session finds nothing planted, but the credential and transcript remain.
            sudo -n -H -u agent bash -c "
              set -eu
              cd /home/agent/.claude
              test ! -e commands
              test ! -e skills
              test ! -e rules
              test ! -e projects/-workspaces-issuebot-7/memory
              test -f .credentials.json
              test -f projects/-workspaces-issuebot-7/keep.jsonl
            "
          '
      # The opt-in toolchain (#62, #64) is only ever built with the build arguments set, so
      # nothing else in CI would notice the PGDG stanza or the nodejs.org download rotting. One
      # build carries both, since the checks below are about what is on PATH and under which
      # uid, not about the two arguments interacting. Its own cache scope: writing mode=max to
      # the default one would replace the cache the build above depends on.
      - name: build with the optional toolchain
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: issuebot:ci-toolchain
          build-args: |
            POSTGRES_VERSION=18
            NODE_VERSION=24
          cache-from: |
            type=gha
            type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      # Twice over for node: once on the image's own PATH, which is what `docker compose run
      # --entrypoint node worker` gets, and once in a login shell, which is what the hooks get
      # after /etc/profile has overwritten PATH.
      - name: the opt-in build has the toolchain on PATH and still runs as issuebot
        run: |
          docker run --rm --entrypoint initdb issuebot:ci-toolchain --version
          docker run --rm --entrypoint node issuebot:ci-toolchain --version
          docker run --rm --entrypoint npm issuebot:ci-toolchain --version
          docker run --rm --entrypoint bash issuebot:ci-toolchain -lc 'command -v initdb && command -v node && command -v npm'
          test "$(docker run --rm --entrypoint id issuebot:ci-toolchain -un)" = issuebot
          test "$(docker run --rm --user agent --entrypoint id issuebot:ci-toolchain -un)" = agent
      - name: the opt-in build's locale is UTF-8
        run: |
          test "$(docker run --rm --entrypoint sh issuebot:ci-toolchain -c 'echo $LANG')" = C.UTF-8
          test "$(docker run --rm --entrypoint bash issuebot:ci-toolchain -lc 'echo $LANG')" = C.UTF-8
          test -z "$(docker run --rm --entrypoint sh issuebot:ci-toolchain -c 'echo ${LC_ALL-}')"
      # The outcome rather than the variable that produces it (#66): a bare `initdb`, with no
      # --encoding and no --locale, is what a session that starts its own cluster runs, and on a
      # C locale it lands on SQL_ASCII silently. A cluster's encoding is fixed at initdb, so the
      # session only finds out in teardown. Asserting the encoding here means a base image that
      # drops the locale, or a C.UTF-8 that stops existing, fails the build instead.
      # Redirected and then grepped rather than piped: sh has no pipefail, so `initdb | grep`
      # would report grep's status alone and pass an initdb that printed the banner and then
      # died -- and grep -q can SIGPIPE initdb part-way through for good measure.
      - name: a bare initdb in the opt-in build makes a UTF8 cluster
        run: |
          docker run --rm --entrypoint sh issuebot:ci-toolchain -c \
            'initdb -D /tmp/c > /tmp/out && grep -q "set to \"UTF8\"" /tmp/out'
      # node --version answers from a tarball that need not be usable. This runs the thing a
      # target repository's after_create hook actually runs, as the uid a session runs as: the
      # npm wrapper on PATH, resolving its own `#!/usr/bin/env node`, writing its cache and its
      # log under $HOME. The tree has no dependencies, so nothing is fetched -- and the
      # registry is pointed at a dead port so that stays true if anyone adds one.
      - name: npm ci runs as the session's account without reaching the registry
        run: |
          mkdir -p /tmp/npm-smoke
          cat > /tmp/npm-smoke/package.json <<'JSON'
          {
            "name": "issuebot-npm-smoke",
            "version": "0.0.0",
            "private": true
          }
          JSON
          cat > /tmp/npm-smoke/package-lock.json <<'JSON'
          {
            "name": "issuebot-npm-smoke",
            "version": "0.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "issuebot-npm-smoke",
                "version": "0.0.0"
              }
            }
          }
          JSON
          chmod -R a+rX /tmp/npm-smoke
          docker run --rm --user agent -v /tmp/npm-smoke:/npm-smoke:ro --entrypoint bash issuebot:ci-toolchain -lc '
            set -eu
            cd "$(mktemp -d)"
            cp /npm-smoke/package.json /npm-smoke/package-lock.json .
            npm ci --no-audit --no-fund --registry=http://127.0.0.1:1/
            test -d "$HOME/.npm"
          '
      # initdb --version prints a string constant, so on its own it proves almost nothing. The
      # hooks the README tells an operator to paste are pulled straight out of README.md and
      # run in the image inside a login shell, as WorkspaceManager's `bash -lc` runs them --
      # which is also the only check that a login shell keeps the PATH /etc/profile resets.
      # after_run and before_remove both end in `|| true`, so running them proves only that
      # they parse; the postmaster has to be gone between the two for the step to mean
      # anything. An `if`, not `! pg_ctl ...`: a pipeline led by `!` is exempt from errexit.
      # `.issuebot/env` is read by the runner, not by a shell, but the recipe writes `export`
      # lines, so sourcing it here is a fair stand-in and keeps this step free of a venv.
      - name: the README's cluster recipe runs in the image
        run: |
          mkdir -p /tmp/hooks
          python3 - <<'PY'
          import pathlib, re
          block = re.search(r"```yaml\nhooks:\n(.*?)```",
                            pathlib.Path("README.md").read_text(), re.S).group(1)
          hooks, name = {}, None
          for line in block.splitlines():
              header = re.fullmatch(r"  (\w+): \|", line)
              if header:
                  name = header.group(1); hooks[name] = []
              elif name and line.startswith("    "):
                  hooks[name].append(line[4:])
              elif line.strip():
                  name = None
          for key, body in hooks.items():
              pathlib.Path(f"/tmp/hooks/{key}.sh").write_text("\n".join(body) + "\n")
          assert set(hooks) == {"before_run", "after_run", "before_remove"}, sorted(hooks)
          PY
          chmod a+rX /tmp/hooks /tmp/hooks/*.sh
          docker run --rm --user agent -v /tmp/hooks:/hooks:ro --entrypoint bash issuebot:ci-toolchain -lc '
            set -eu
            cd "$(mktemp -d)"
            bash /hooks/before_run.sh
            bash /hooks/before_run.sh
            . .issuebot/env
            test "$(psql "$ARROWBOT_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 1")" = 1
            bash /hooks/after_run.sh
            if pg_ctl -D .issuebot/pg/data status >/dev/null 2>&1; then
              echo "after_run left the postmaster running" >&2
              exit 1
            fi
            bash /hooks/before_remove.sh
          '
