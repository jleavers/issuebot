name: pre-commit hooks version

# The hooks in .pre-commit-config.yaml are pinned to commit digests (#111), which Dependabot
# does not move: it bumps the digest-pinned `uses:` lines in these workflows, but has no
# ecosystem for pre-commit. This job is that missing update PR, of the same shape as
# claude-code-version.yml: `pre-commit autoupdate --freeze` rewrites every `rev:` to the
# digest of each hook repository's newest tag, the hooks are run over the tree at the new
# digests as the proof, and one pull request carries the move.
#
# It runs as two jobs on purpose, and the split is #111's own rule applied to this workflow.
# `freeze` fetches each hook repository at a tag it has not seen before, `pip install`s it --
# arbitrary build-backend code -- and runs its entry points. That is third-party code whose
# referent nobody has checked yet, which is the whole reason the digests exist, so it executes
# with a read-only `GITHUB_TOKEN` and with `persist-credentials: false`, so the checkout leaves
# no pushable credential in `.git/config` for it to read. `open-pr` holds the write scopes and
# runs no hook: it takes the frozen config as an artefact, re-checks its shape, commits, pushes
# and opens the pull request. The workflow that hardens the supply chain must not be the one
# that hands it a token.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General > Workflow permissions), as for claude-code-version.yml.

on:
  schedule:
    # Mondays, 06:00 UTC, alongside the weekly Dependabot runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: pre-commit-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.check.outputs.branch }}
      changed: ${{ steps.check.outputs.changed }}
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, and the hooks below are unreviewed upstream code.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen

      - id: check
        name: Freeze every rev at its newest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run pre-commit autoupdate --freeze
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "::notice::every rev is at its newest tag; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag must have become a digest, never the other way round: the config's own test
          # (tests/test_pins.py) refuses a tag, and so does this job before it pushes one.
          if git diff -U0 -- .pre-commit-config.yaml | grep -E '^\+ *rev:' \
               | grep -Ev '^\+ *rev: [0-9a-f]{40}  # frozen: '; then
            echo "::error::autoupdate wrote a rev that is not a frozen digest"
            exit 1
          fi
          # The branch is named for the config it proposes, so a rerun that lands on the same
          # digests finds its own branch and pull request rather than opening a second.
          branch="pre-commit-hooks-$(git hash-object .pre-commit-config.yaml | cut -c1-12)"
          git diff -U0 -- .pre-commit-config.yaml | grep -E '^[-+] *rev:' > /tmp/revs.txt || true
          changed=true
          reuse=false
          # "This job's pull request" is decided by provenance, not by the branch name
          # (#111): the REST head filter is owner-qualified, and what survives it is kept
          # only when its head is this repository and its author is the bot this job runs
          # as (github-actions[bot] is GITHUB_TOKEN's login: a switch to a PAT or an App
          # changes it, and the POST in open-pr then fails loudly with 422, not silently).
          # A fork's branch of the same name, from any account, is not this job's.
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100&head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --jq "[.[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\" and .user.login == \"github-actions[bot]\")] | .[0].number // \"\"")"
          if [ -n "${pr}" ]; then
            echo "::notice::${branch} already has pull request #${pr}; nothing to do"
            changed=false
          else
            # Asked of the API, not of `git ls-remote`: this checkout persists no
            # credential, so against a private repository an unauthenticated ls-remote
            # fails with "Repository not found" rather than reporting an absent branch,
            # and an `elif` around it would read that failure as "the branch is not
            # there" -- losing the reuse path, which is the one that finishes a run that
            # pushed and then failed before opening the pull request (#148). `gh` still
            # has GH_TOKEN, and reading a ref is contents: read.
            #
            # `matching-refs` answers an absent branch with 200 and an empty list, so
            # "no branch" is a *successful* reply and every non-zero exit is a real
            # failure -- no parsing of gh's English error text to tell them apart. It is
            # a prefix query, hence the exact-ref filter. A failure fails the run: a
            # 5xx or a rate limit answered "no" would have open-pr try to create a
            # branch that is already there and be rejected on push.
            if ! found="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}" \
                 --jq "[.[] | select(.ref == \"refs/heads/${branch}\")] | length")"; then
              echo "::error::could not read refs/heads/${branch}"
              exit 1
            fi
            if [ "${found}" != "0" ]; then
              echo "::notice::${branch} exists with no pull request; reusing it"
              reuse=true
            fi
          fi
          {
            echo "branch=${branch}"
            echo "changed=${changed}"
            echo "reuse=${reuse}"
          } >> "$GITHUB_OUTPUT"

      # Proof before the PR exists: the hooks install at the new digests and the tree passes.
      # This is the step that runs code fetched from the new tags, which is why the job it
      # sits in holds no write scope and no persisted credential.
      - name: Run the hooks at the new digests
        if: steps.check.outputs.changed == 'true'
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Collect the frozen config for the job that can push
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen
          cp .pre-commit-config.yaml /tmp/frozen/pre-commit-config.yaml
          cp /tmp/revs.txt /tmp/frozen/revs.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check.outputs.changed == 'true'
        with:
          name: frozen-pre-commit-config
          path: /tmp/frozen/
          retention-days: 1

  open-pr:
    needs: freeze
    if: needs.freeze.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pre-commit-config
          path: /tmp/frozen

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.freeze.outputs.branch }}
          REUSE: ${{ needs.freeze.outputs.reuse }}
        run: |
          set -euo pipefail
          # The artefact crossed a job boundary from the job that ran the unreviewed hooks,
          # so its shape is re-checked here, in the job that pushes: this one must never
          # write a tag where a digest belongs. Ahead of both arms, because a branch this
          # job did not write is reused below only when it carries this very file.
          if grep -E '^ *rev:' /tmp/frozen/pre-commit-config.yaml \
               | grep -Ev '^ *rev: [0-9a-f]{40}  # frozen: '; then
            echo "::error::the frozen config carries a rev that is not a digest"
            exit 1
          fi
          # ... and it has to carry one. The grep above reports the lines that are *not*
          # digests, so a config with no `rev:` line at all passes it saying nothing, and
          # since the reuse arm below accepts a branch by comparing it with this file, that
          # silence would be the only thing either arm checked.
          if ! grep -qE '^ *rev: [0-9a-f]{40}  # frozen: ' /tmp/frozen/pre-commit-config.yaml; then
            echo "::error::the frozen config pins no hook at a digest"
            exit 1
          fi
          if [ "${REUSE}" = "true" ]; then
            # Fetched under a name this step chooses, rather than on the `remote.origin.fetch`
            # the checkout happens to have left and git's opportunistic update of the
            # remote-tracking ref underneath it. The branch is then a local ref that exists
            # or a `git fetch` that failed, with no third answer for the checkout to DWIM.
            git fetch origin "+refs/heads/${BRANCH}:refs/heads/${BRANCH}"
            git checkout "${BRANCH}"
            # A branch left on the remote is whatever is on the remote -- the wreckage of an
            # earlier run, and writable by anyone who can push here -- so it is held to the
            # same rule as one this job writes, and to the same *shape*. `freeze` ran the
            # hooks over the config it froze, and the body below says so, so the branch is
            # reused only when it carries that very file and moves nothing else. This arm
            # could not run at all until #148, so nothing had ever looked at what it reuses.
            if ! cmp -s /tmp/frozen/pre-commit-config.yaml .pre-commit-config.yaml; then
              echo "::error::${BRANCH} does not carry the config the hooks were run over." \
                "Delete the branch and rerun this workflow to rebuild it."
              exit 1
            fi
            # ... and it moves that file and no other. Asked of the API, because the
            # question is what the branch *changes*, which is measured from where it left
            # the default branch and not from wherever that branch has since got to: a
            # local `git diff origin/${GITHUB_REF_NAME} ${BRANCH}` compares two tips, so
            # every commit merged since the branch was pushed reads as another path the
            # branch touches, and a week-old branch -- the ordinary case for a rerun -- is
            # refused for someone else's change. `compare` measures from the merge base,
            # as the pull request itself will, and needs no history in this shallow
            # checkout to do it. A failure fails the run rather than reading as "no files".
            if ! moved="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${BRANCH}" \
                 --jq '[.files[].filename] | join(" ")')"; then
              echo "::error::could not compare ${BRANCH} with ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [ "${moved}" != ".pre-commit-config.yaml" ]; then
              echo "::error::${BRANCH} changes more than the hook pins, so it is not what" \
                "was proved: ${moved}. Delete the branch and rerun this workflow."
              exit 1
            fi
          else
            cp /tmp/frozen/pre-commit-config.yaml .pre-commit-config.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "${BRANCH}"
            git commit -am "build: freeze the pre-commit hooks at their newest tags"
            git push -u origin "${BRANCH}"
          fi
          {
            echo 'The pre-commit hooks, re-frozen by `pre-commit autoupdate --freeze` at the'
            echo 'digest of each repository'"'"'s newest tag (#111):'
            echo
            echo '```diff'
            cat /tmp/frozen/revs.txt
            echo '```'
            echo
            echo 'The hooks were run over the whole tree at these digests before the pull'
            echo 'request was opened, so they install and the tree passes them. A ruff move'
            echo 'here changes only the hook; the `ruff` the lockfile pins is Dependabot'"'"'s.'
            echo
            echo 'Note: pull requests opened with `GITHUB_TOKEN` do not start the CI workflow.'
            echo 'Close and reopen this pull request, or push to the branch, to run it.'
          } > /tmp/pr-body.md
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls" -X POST \
            -f title="build: freeze the pre-commit hooks at their newest tags" \
            -f head="${BRANCH}" \
            -f base="${GITHUB_REF_NAME}" \
            -F body=@/tmp/pr-body.md \
            --jq '.html_url'
          then
            echo "::error::could not open the pull request. If this is HTTP 403, turn on" \
              "Settings > Actions > General > Workflow permissions >" \
              "'Allow GitHub Actions to create and approve pull requests'." \
              "The branch ${BRANCH} is pushed; re-running this job will reuse it."
            exit 1
          fi
