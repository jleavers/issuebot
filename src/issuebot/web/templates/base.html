<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval": false, "selfRequestsOnly": true, "includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "503", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
<title>{% block title %}issuebot{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:,">
<meta name="color-scheme" content="light dark">
<!-- synchronous, and ahead of the body: the theme is stamped before the first paint -->
<script src="/static/theme.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">issuebot</a>
  <span class="repo">{{ repo }}</span>
  <nav>
    <a href="/">dashboard</a>
    <a href="/issues">issues</a>
    <a href="/api/v1/state">api</a>
    <a href="/healthz">health</a>
  </nav>
  <!-- a control, not navigation, so it sits beside the nav; the label says "switch the
       theme" until theme.js knows which theme is showing and can name the destination -->
  <button class="theme-toggle" type="button" title="Switch the colour theme" aria-label="Switch the colour theme">
    <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 1.1a6.9 6.9 0 1 0 5.3 8.6 5.6 5.6 0 0 1-5.3-8.6z"/></svg>
    <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm0-8.3a.8.8 0 0 1-.8-.8V.8a.8.8 0 0 1 1.6 0v1.3a.8.8 0 0 1-.8.8zm0 12.2a.8.8 0 0 1-.8-.8v-1.3a.8.8 0 0 1 1.6 0v1.3a.8.8 0 0 1-.8.8zM15.2 8.8h-1.3a.8.8 0 0 1 0-1.6h1.3a.8.8 0 0 1 0 1.6zm-13.1 0H.8a.8.8 0 0 1 0-1.6h1.3a.8.8 0 0 1 0 1.6zm10.6 4.9a.8.8 0 0 1-.6-.2l-.9-.9a.8.8 0 0 1 1.1-1.1l.9.9a.8.8 0 0 1-.5 1.3zM3.7 4.5a.8.8 0 0 1-.6-.2l-.9-.9a.8.8 0 1 1 1.1-1.1l.9.9a.8.8 0 0 1-.5 1.3zm-1.4 9.2a.8.8 0 0 1-.6-1.3l.9-.9a.8.8 0 0 1 1.1 1.1l-.9.9a.8.8 0 0 1-.5.2zm10-9.2a.8.8 0 0 1-.6-1.3l.9-.9a.8.8 0 1 1 1.1 1.1l-.9.9a.8.8 0 0 1-.5.2z"/></svg>
  </button>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/vendor/htmx.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
