# Recorded agent runs are kept as the scrubber wrote them (the tests pin their sizes) and
# vendored libraries byte-for-byte as their authors wrote them.
#
# Every rev is a commit digest, as `pre-commit autoupdate --freeze` writes it (#111): a tag
# is a name its owner can repoint, and these hooks run in CI and on any host that runs them,
# where GH_TOKEN and the store's DSN are ambient. The weekly pre-commit-version workflow
# moves them; tests/test_pins.py refuses a tag.
exclude: ^(tests/fixtures/runs/|src/issuebot/web/static/vendor/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
