[project]
name = "issuebot"
version = "0.1.0"
description = "Symphony-style issue-to-PR agent orchestrator built on Claude and GitHub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141",
  "jinja2>=3.1",
  "psycopg[binary]>=3.3",
  "pydantic>=2.12",
  "pyyaml>=6.0",
  "structlog>=25.1",
  "uvicorn>=0.52",
]

[project.scripts]
issuebot = "issuebot.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12",
  "pre-commit>=4.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuebot"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # Starlette 1.6's test client still names anyio's deprecated alias at import time.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
