[project]
name = "issuebot"
version = "0.1.0"
description = "Symphony-style issue-to-PR agent orchestrator built on Claude and GitHub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.12",
  "pyyaml>=6.0",
  "structlog>=25.1",
]

[project.scripts]
issuebot = "issuebot.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuebot"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]
per-file-ignores = { "tests/**/*.py" = ["SIM300"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
