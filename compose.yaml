# Two roles in one file, chosen by COMPOSE_PROFILES in this checkout's .env:
#   hub     -> db + web        (one checkout on the host)
#   worker  -> worker          (every checkout, this one included)
# So the hub checkout says COMPOSE_PROFILES=hub,worker and every other says worker.
services:
  db:
    image: postgres:18
    profiles: ["hub"]
    networks: [issuebot]
    environment:
      POSTGRES_USER: issuebot
      POSTGRES_PASSWORD: issuebot
      POSTGRES_DB: issuebot
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      # Override with ISSUEBOT_DB_PORT in the project dot-env file if 5432 is taken on the host.
      - "127.0.0.1:${ISSUEBOT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuebot -d issuebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A throwaway PostgreSQL for the local test run, isolated from the `db` above so the suite
  # never writes to the database the worker and the web are using. Behind a profile, so a
  # plain `docker compose up` does not start it:
  #
  #   docker compose --profile test up -d --wait test-db
  #   DATABASE_URL=postgresql://issuebot:issuebot@$(docker compose port test-db 5432)/issuebot \
  #     uv run pytest
  #   docker compose rm -sf test-db
  #
  # That last line, not `docker compose down`: `down` is project-wide, so it would stop the
  # long-lived db, worker and web along with the throwaway.
  test-db:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_USER: issuebot
      POSTGRES_PASSWORD: issuebot
      POSTGRES_DB: issuebot
    # No named volume: the cluster lives in RAM and goes when the container does, which is
    # the point of a throwaway. tmpfs at the parent, as pgdata is mounted for `db`.
    tmpfs:
      - /var/lib/postgresql
    ports:
      # No host port named. This host runs a database per project and the low 543x numbers
      # are taken; letting Docker pick an ephemeral one means a test run can never collide
      # with them, or with whatever the next project claims. `docker compose port test-db
      # 5432` reads back the one it chose.
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuebot -d issuebot"]
      interval: 2s
      timeout: 5s
      retries: 15

  worker:
    build:
      context: .
      args:
        # Empty -- the default -- bakes no PostgreSQL server into the worker image. Set
        # ISSUEBOT_POSTGRES_VERSION in this checkout's .env when the target repository's tests
        # need a real server, and `docker compose build worker` to pick it up (README, "A
        # PostgreSQL server for the target repository's tests"). The web service builds from
        # the same context without it: the dashboard needs no server, and a hub that sets the
        # variable would otherwise carry the packages twice.
        POSTGRES_VERSION: "${ISSUEBOT_POSTGRES_VERSION:-}"
        # Likewise for a JavaScript runtime, when the target repository's tests execute its
        # own client-side code (README, "Node for the target repository's tests"). Empty bakes
        # nothing; `docker compose build worker` to pick a change up.
        NODE_VERSION: "${ISSUEBOT_NODE_VERSION:-}"
    profiles: ["worker"]
    networks: [issuebot]
    # The worker applies pending database migrations when it starts (issuebot migrate is the
    # manual equivalent) and fails fast if DATABASE_URL is set but the server is unusable.
    command: ["worker"]
    # tini as PID 1 reaps grandchildren that outlive a killed claude.
    init: true
    restart: unless-stopped
    # Longer than the orchestrator's shutdown wait (hooks.timeout_ms + 20 s), so Docker never
    # SIGKILLs a worker that is still running after_run.
    stop_grace_period: 120s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://issuebot:issuebot@db:5432/issuebot
      # The directory below is what is mounted; this names the file inside it. Keep the two
      # in step if you rename either.
      ISSUEBOT_WORKFLOW: /configs/WORKFLOW.md
    volumes:
      # The DIRECTORY, not the file. A single-file bind mount resolves to the inode, so an
      # editor that saves by writing a temporary file and renaming it over the original --
      # which is most of them, and `sed -i` too -- leaves the container bound to the old,
      # now-unlinked inode and serving the old settings until it is recreated (#46). Mounting
      # the directory means the lookup goes through the host's directory entry every time, so
      # an atomic save is picked up by the worker's next tick.
      - ./configs:/configs:ro
      - workspaces:/workspaces
      - claude-home:/home/issuebot/.claude
    # No depends_on: the database may be in another checkout's project (the hub). A worker
    # that starts first fails its migration, prints [FAIL] database: and exits 1, and
    # restart: unless-stopped brings it back until the hub answers.

  web:
    build: .
    profiles: ["hub"]
    networks: [issuebot]
    # The dashboard and the JSON API for every repository on this database. Reads nothing but
    # DATABASE_URL; no workflow, no GitHub, Claude or Slack credential.
    command: ["web", "--bind", "0.0.0.0", "--port", "8080"]
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://issuebot:issuebot@db:5432/issuebot
    ports:
      # Loopback only: the dashboard has no authentication. Override the host port with
      # ISSUEBOT_WEB_PORT in the project dot-env file; the container side is the --port above.
      - "127.0.0.1:${ISSUEBOT_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  workspaces:
  claude-home:

# Every project on the host joins one network, created once with `docker network create
# issuebot`, so a worker in another checkout resolves the hub's database as `db`. External
# in every project rather than owned by the hub: a single compose file cannot declare it
# both ways, and a project that finds a network it did not create refuses to start.
networks:
  issuebot:
    external: true
